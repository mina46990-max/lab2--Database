<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}To-Do{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="card">
{% if session.user_id %}
<div class="topbar">
  <span>Hi, {{ session.name }}</span>
  <form method="post" action="{{ url_for('logout') }}"><button class="btn ghost">Log out</button></form>
</div>
{% endif %}
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
