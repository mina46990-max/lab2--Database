{% extends "base.html" %}
{% block content %}
<h1>To-Do</h1>
<form method="post" action="{{ url_for('add') }}" data-validate novalidate class="addform">
  <div class="row">
    <input name="title" placeholder="What needs to be done?" value="{{ add_title }}"
      data-required="Title is required" data-max="200" data-toolong="Title is too long (200 characters at most)">
    <button class="btn">Add</button>
  </div>
  <div class="err" data-for="title">{{ add_error }}</div>
</form>

{% for t in todos %}
<div class="item {{ 'done' if t.is_done }}">
  <form method="post" action="{{ url_for('toggle', todo_id=t.todo_id) }}">
    <input type="hidden" name="is_done" value="{{ 0 if t.is_done else 1 }}">
    <button class="check" aria-label="Mark done or not done">{{ '✓' if t.is_done }}</button>
  </form>
  <form method="post" action="{{ url_for('edit', todo_id=t.todo_id) }}" data-validate novalidate class="grow">
    <div class="row">
      <input name="title" value="{{ edit_title if edit_id == t.todo_id else t.title }}"
        data-required="Title is required" data-max="200" data-toolong="Title is too long (200 characters at most)">
      <button class="btn ghost">Save</button>
    </div>
    <div class="err" data-for="title">{{ edit_error if edit_id == t.todo_id }}</div>
  </form>
  <form method="post" action="{{ url_for('delete', todo_id=t.todo_id) }}" data-confirm="Are you sure you want to delete this to-do?">
    <button class="btn danger">Delete</button>
  </form>
</div>
{% else %}
<p class="empty">Nothing to do yet. Add your first task above.</p>
{% endfor %}
{% endblock %}
